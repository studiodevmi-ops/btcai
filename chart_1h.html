let showDays = 7;

function setDays(d) {
    showDays = d;
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    draw();
}

function draw() {
    const canvas = document.getElementById('canvas');
    const container = canvas.parentElement;
    const ctx = canvas.getContext('2d');

    // 최근 N일 필터
    const cutoff = new Date(CANDLES[CANDLES.length-1].t);
    cutoff.setDate(cutoff.getDate() - showDays);
    const cutStr = cutoff.toISOString().slice(0,16).replace('T',' ');
    const data = CANDLES.filter(c => c.t >= cutStr);
    const sigs = SIGNALS.filter(s => s.t >= cutStr);

    if (data.length === 0) return;

    const cw = 16;
    const padding = {top:20, bottom:30, left:60, right:40};
    const W = padding.left + data.length * cw + padding.right;
    const H = 600;

    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.clearRect(0, 0, W, H);

    // 자동 스크롤 오른쪽 끝
    setTimeout(() => container.scrollLeft = container.scrollWidth, 100);
    const prices = data.flatMap(c => [c.h, c.l]);
    let minP = Math.min(...prices), maxP = Math.max(...prices);
    const range = maxP - minP;
    minP -= range * 0.05; maxP += range * 0.08;

    const toX = i => padding.left + i * cw + cw/2;
    const toY = p => padding.top + (maxP - p) / (maxP - minP) * (H - padding.top - padding.bottom);

    // 시간 → index 맵
    const timeIdx = {};
    data.forEach((c, i) => timeIdx[c.t] = i);

    // 가격축
    ctx.strokeStyle = '#21262d';
    ctx.fillStyle = '#484f58';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    const step = Math.pow(10, Math.floor(Math.log10(range/5)));
    for (let p = Math.ceil(minP/step)*step; p <= maxP; p += step) {
        const y = toY(p);
        ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(W-padding.right, y); ctx.stroke();
        ctx.fillText('$'+p.toLocaleString(), padding.left-4, y+3);
    }

    // 캔들
    data.forEach((c, i) => {
        const x = toX(i);
        const bull = c.c >= c.o;
        ctx.strokeStyle = bull ? '#3fb950' : '#f85149';
        ctx.fillStyle = bull ? '#3fb950' : '#f85149';

        // 위크
        ctx.beginPath();
        ctx.moveTo(x, toY(c.h));
        ctx.lineTo(x, toY(c.l));
        ctx.lineWidth = 1;
        ctx.stroke();

        // 바디
        const bodyTop = toY(Math.max(c.o, c.c));
        const bodyBot = toY(Math.min(c.o, c.c));
        const bodyH = Math.max(bodyBot - bodyTop, 1);
        if (bull) {
            ctx.fillRect(x - cw*0.35, bodyTop, cw*0.7, bodyH);
        } else {
            ctx.fillRect(x - cw*0.35, bodyTop, cw*0.7, bodyH);
        }
    });

    // 시그널 마커
    let correct = 0, wrong = 0;
    sigs.forEach(s => {
        const idx = timeIdx[s.t];
        if (idx === undefined) return;
        const x = toX(idx);
        const c = data[idx];
        const isUp = s.d === 'U';
        const ok = s.r === 1;

        if (ok) correct++; else wrong++;

        const y = isUp ? toY(c.l) + 12 : toY(c.h) - 12;
        const arrow = isUp ? '▲' : '▼';

        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = ok ? '#3fb950' : '#f85149';
        ctx.fillText(arrow, x, y);

        ctx.font = '8px monospace';
        ctx.fillStyle = ok ? '#3fb95088' : '#f8514988';
        ctx.fillText(ok ? '✓' : '✗', x, y + (isUp ? 10 : -8));
    });

    // 통계
    const total = correct + wrong;
    const wr = total > 0 ? (correct/total*100).toFixed(0) : '—';
    document.getElementById('stats').textContent =
        `${total} signals | ✓${correct} ✗${wrong} | ${wr}%`;

    // 날짜 라벨
    ctx.fillStyle = '#484f58';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    const labelStep = Math.max(1, Math.floor(data.length / 15));
    data.forEach((c, i) => {
        if (i % labelStep === 0) {
            ctx.fillText(c.t.slice(5,10), toX(i), H - 8);
        }
    });
}
