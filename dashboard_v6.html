<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC v6 Signal Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; }
.header {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 20px; color: #f0883e; }
.nav {
    display: flex; align-items: center; gap: 12px;
    background: #21262d; border-radius: 8px; padding: 6px 12px;
}
.nav button {
    background: none; border: 1px solid #30363d; color: #c9d1d9;
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 16px; font-family: inherit;
}
.nav button:hover { background: #30363d; }
.nav .date { font-size: 18px; font-weight: bold; min-width: 140px; text-align: center; }
.summary {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    margin: 16px 24px; padding: 16px; display: flex; gap: 30px; flex-wrap: wrap;
}
.stat { text-align: center; }
.stat .val { font-size: 24px; font-weight: bold; color: #58a6ff; }
.stat .label { font-size: 12px; color: #8b949e; margin-top: 2px; }
.content { padding: 0 24px 24px; }
.hour-block {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    margin: 8px 0; padding: 12px 16px;
}
.hour-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.hour-label { font-size: 16px; font-weight: bold; color: #f0883e; }
.hour-price { font-size: 13px; color: #8b949e; }
.no-signal { color: #484f58; font-style: italic; font-size: 13px; }
.signals { display: flex; flex-wrap: wrap; gap: 4px; }
.sig {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: bold;
    cursor: default; position: relative;
}
.sig:hover .tooltip { display: block; }
.tooltip {
    display: none; position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px;
    font-size: 11px; white-space: nowrap; z-index: 10; font-weight: normal;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.empty-day { text-align: center; padding: 60px; color: #484f58; font-size: 16px; }
.header-links a {
    color:#58a6ff; font-size:11px; text-decoration:none;
    border:1px solid #30363d; padding:3px 8px; border-radius:4px; margin-left:6px;
}
</style>
</head>

00", "2026-03-18": "09:00", "2026-03-19": "09:00"}};
let currentIdx = DATA.dates.length - 1;

function render() {
    const date = DATA.dates[currentIdx];
    document.getElementById("dateLabel").textContent = date + " (KST)";
    const st = DATA.stats[date] || {total:0, correct:0, up:0, down:0};
    const wr = st.total > 0 ? (st.correct / st.total * 100).toFixed(1) : "—";
    const sigs = DATA.signals[date] || {};

    let voteTotal = 0, voteCorrect = 0;
    for (let h = 0; h < 24; h++) {
        const hk = String(h).padStart(2, "0") + ":00";
        const hourSigs = sigs[hk] || [];
        if (hourSigs.length === 0) continue;
        const upCnt = hourSigs.filter(s => s.d === "U").length;
        const downCnt = hourSigs.filter(s => s.d === "D").length;
        if (upCnt === downCnt) continue;
        const majorityDir = upCnt > downCnt ? "U" : "D";
        const majoritySigs = hourSigs.filter(s => s.d === majorityDir);
        const correctCnt = majoritySigs.filter(s => s.r === 1).length;
        voteTotal++;
        if (correctCnt > majoritySigs.length / 2) voteCorrect++;
    }
    const voteWr = voteTotal > 0 ? (voteCorrect / voteTotal * 100).toFixed(0) : "—";
    const voteColor = voteTotal > 0 && voteCorrect / voteTotal >= 0.5 ? "#3fb950" : "#f85149";

    document.getElementById("summary").innerHTML = `
        <div class="stat"><div class="val">${st.total}</div><div class="label">Signals</div></div>
        <div class="stat"><div class="val" style="color:#f78166">${st.up}</div><div class="label">▲ UP</div></div>
        <div class="stat"><div class="val" style="color:#79c0ff">${st.down}</div><div class="label">▼ DOWN</div></div>
        <div class="stat"><div class="val">${wr}%</div><div class="label">Win Rate (${st.correct}/${st.total})</div></div>
        <div class="stat"><div class="val" style="color:${voteColor}">${voteCorrect}/${voteTotal}</div><div class="label">Majority Vote (${voteWr}%)</div></div>
    `;

    const prices = DATA.prices[date] || {};
    let html = "";
    const lastPredHour = DATA.lastPred[date] || null;

    for (let h = 23; h >= 0; h--) {
        const hk = String(h).padStart(2, "0") + ":00";
        const hourSigs = sigs[hk] || [];
        const price = prices[hk] ? "$" + prices[hk].toLocaleString() : "";
        const nextH = String((h + 1) % 24).padStart(2, "0") + ":00";
        const isLatest = (hk === lastPredHour);

        let hourVote = "";
        if (hourSigs.length > 0) {
            const hu = hourSigs.filter(s => s.d === "U").length;
            const hd = hourSigs.filter(s => s.d === "D").length;
            if (hu !== hd) {
                const mDir = hu > hd ? "U" : "D";
                const mSigs = hourSigs.filter(s => s.d === mDir);
                const mOk = mSigs.filter(s => s.r === 1).length;
                const mResult = mOk > mSigs.length / 2;
                const mArrow = mDir === "U" ? "▲" : "▼";
                const mColor = mResult ? "#3fb950" : "#f85149";
                hourVote = `<span style="color:${mColor};font-size:13px;font-weight:bold;margin-left:8px;">${mArrow} ${mDir === "U" ? "UP" : "DOWN"} ${mResult ? "✓" : "✗"}</span>`;
            }
        }

        html += `<div class="hour-block" ${isLatest ? 'style="border:2px solid #f0883e;box-shadow:0 0 8px rgba(240,136,62,0.3);"' : ''}>`;
        html += `<div class="hour-header"><span class="hour-label">${hk} KST</span><span class="hour-price">${price}</span><span style="color:#8b949e;font-size:11px;margin-left:6px;">→ ${hk}~${nextH} 봉 예측</span>${hourVote}</div>`;

        if (hourSigs.length === 0) {
            html += `<div class="no-signal">No signal</div>`;
        } else {
            html += `<div class="signals">`;
            for (const s of hourSigs) {
                const isUp = s.d === "U";
                const bg = getColor(s.w, isUp);
                const arrow = isUp ? "▲" : "▼";
                const result = s.r === 1 ? "✓" : s.r === 0 ? "✗" : "?";
                const resultColor = s.r === 1 ? "#3fb950" : s.r === 0 ? "#f85149" : "#888";
                const dir = isUp ? "UP" : "DOWN";
                html += `<span class="sig" style="background:${bg};color:#fff;">
                    <span>${arrow}</span>
                    <span>${s.w}%</span>
                    <span style="font-weight:normal">${s.c}</span>
                    <span style="color:${resultColor}">${result}</span>
                    <span class="tooltip">${dir} | XGB: ${s.xp} LGB: ${s.lp}</span>
                </span>`;
            }
            html += `</div>`;
        }
        html += `</div>`;
    }

    if (!html) html = `<div class="empty-day">No data for this date</div>`;
    document.getElementById("content").innerHTML = html;
}

function getColor(wr, isUp) {
    const buyColors = {70:"#5c2020",72:"#6b2222",74:"#7a2525",76:"#892828",78:"#982b2b",80:"#a73030",82:"#b63535",84:"#c53a3a",86:"#d44040",88:"#e34545",90:"#f04a4a",92:"#f55050",94:"#f86060",96:"#fa7070",98:"#fc8080",100:"#ff9090"};
    const sellColors = {70:"#1a2040",72:"#1e2550",74:"#222a60",76:"#263070",78:"#2a3680",80:"#2e3c90",82:"#3242a0",84:"#3648b0",86:"#3a4ec0",88:"#3e54d0",90:"#425ae0",92:"#4660f0",94:"#5070f5",96:"#6080f8",98:"#7090fa",100:"#80a0fc"};
    const colors = isUp ? buyColors : sellColors;
    const keys = Object.keys(colors).map(Number).sort((a,b) => a-b);
    let best = keys[0];
    for (const k of keys) { if (k <= wr) best = k; }
    return colors[best];
}

function prevDay() { if (currentIdx > 0) { currentIdx--; render(); } }
function nextDay() { if (currentIdx < DATA.dates.length - 1) { currentIdx++; render(); } }
document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") prevDay();
    if (e.key === "ArrowRight") nextDay();
});
render();
</script>
